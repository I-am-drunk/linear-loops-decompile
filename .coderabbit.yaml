# .coderabbit.yaml — CodeRabbit policy for linear-loops-decompile.
# Deliberately minimal (the T3 Code pattern): the bot is good out of the box;
# our job is to stay out of its way. Project conventions live in AGENTS.md —
# they are NOT injected into the review agent (that over-fitting is scope creep).
reviews:
  review_status: false          # no giant summary comment; the `CodeRabbit` check still posts
  auto_review:
    enabled: true               # reviews every PR and re-reviews each push (incremental passes)
  path_filters:                 # vendored/reference material is not ours to review
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!extracts/linear-official/**"   # MIT-licensed Linear SDK schema + generated ops
